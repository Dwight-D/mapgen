name: three_team
brief: |
  Three teams in a triangle around a central lake split into three lobes by three land bridges. Each
  road runs from a base along a land bridge to the island keep in the middle. Hills with ruins flank
  the outer ring, forests give cover between the roads, and outer trails let teams flank each other.
  The layout has three-fold rotational symmetry, so every team should reach the neutral objectives
  in about the same time. Test: the island keep and relic are contested three ways; the bridges are
  the chokepoints.
size: [3000, 3000]
seed: 7

terrain:
  base_height: 40
  relief: 20

teams:
  A: { base: [1500, 2650], color: "#2f6fdf", name: North }
  B: { base: [504, 925],   color: "#f2a81d", name: Southwest }
  C: { base: [2496, 925],  color: "#6a2cc0", name: Southeast }

