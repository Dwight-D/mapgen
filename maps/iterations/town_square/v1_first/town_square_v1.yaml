# town_square v1: first scaffold-based PoC, 3000x2400.
# Source: commit 5e5d24c (maps/concepts/town_square.yaml).
format_version: 1
name: town_square_v1
brief: |
  PITCH: Two teams fight over a market town's open square. Each side's basin is closed off by a ridge with
  exactly three exits: a narrow gate straight into the square (Team A gate / Team B gate), and two road
  gaps leading to the flank country. The flanks run south through Great Oak Hill and the alley quarter,
  or north through Forest Glen and the attic, and enter the square from the side.
  FLOW (flowgraph topology, see flowgraphs/town_square.flow.yaml): A-AO-O and B-BO-O are the gate routes
  (short, exposed, narrow gaps in the ridge); A/B -> G -> Fa -> O is the south flank; A/B -> F -> Fb -> O
  the north flank. G and F are strategic control zones reachable from both teams, so the flanks are
  contested rather than owned.
  CHARACTER: O is open town ground with long sightlines. Fa is a dense alley quarter (town plus ruins,
  short winding trails) - close quarters. Fb is the attic: a hilltop of ruins above the square,
  elevated, enclosed, reached by one trail. G is a wooded hill, F a deep forest with a glade at the zone.
  The bases are not mirrored: A sits in a walled town, B in an open clearing.
  TEST: do the gates become a meat grinder or get bypassed by the flanks? Does G or F decide the match?
  Is the attic worth the climb, or just a sniper nest over the square?
  NOTE: every road is a single road/trail between the intended node pair; ridges close the basins so the
  gates and flank gaps are the only ways through and the derived topology matches the flowgraph.
size: [3000, 2400]
seed: 4417

terrain:
  height_max: 600
  base_height: 50
  relief: 20
  relief_scale: 1100
  detail: 6
  detail_scale: 200

teams:
  A: { base: [330, 1230], color: "#2f6fdf", name: "Team A spawn" }
  B: { base: [2690, 1150], color: "#f2a81d", name: "Team B spawn" }

points:
  ao: [900, 1200]
  bo: [2120, 1170]
  gap_a_south: [840, 470]
  gap_a_north: [830, 1960]
  gap_b_south: [2150, 560]
  gap_b_north: [2170, 1880]

pois:
  - { id: o,  type: capture,  at: [1510, 1190], label: "Town square" }
  - { id: fa, type: landmark, at: [1700, 790],  label: "Flank A" }
  - { id: fb, type: landmark, at: [1290, 1660], label: "Flank B" }
  - { id: g,  type: capture,  at: [1400, 360],  label: "Great Oak Hill" }
  - { id: f,  type: capture,  at: [1560, 2060], label: "Forest Glen" }

scatter:
  - { id: s_field, seed: 1, type: field,  coverage: 0.25, scale: 220, clump: 0.3, avoid: 20, within: [[0, 0], [820, 0], [800, 2400], [0, 2400]] }
  - { id: s_field_b, seed: 2, type: field, coverage: 0.2, scale: 220, clump: 0.3, avoid: 20, within: [[2200, 0], [3000, 0], [3000, 2400], [2230, 2400]] }
  - { id: s_wood, seed: 3, type: forest, coverage: 0.12, scale: 180, clump: 0.4, avoid: 14, within: [[0, 0], [820, 0], [800, 2400], [0, 2400]] }
  - { id: s_wood_b, seed: 4, type: forest, coverage: 0.3, scale: 200, clump: 0.4, avoid: 14, within: [[2200, 0], [3000, 0], [3000, 2400], [2230, 2400]] }

regions:
  # Team A ridge: four segments, gaps at the south road, the gate and the north road
  - { id: ridge_a1, seed: 1, type: mountain, shape: band, path: [[880, 0], [830, 180], [850, 330]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  - { id: ridge_a2, seed: 2, type: mountain, shape: band, path: [[820, 620], [860, 880], [905, 1100]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  - { id: ridge_a3, seed: 3, type: mountain, shape: band, path: [[910, 1300], [850, 1560], [800, 1780]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  - { id: ridge_a4, seed: 4, type: mountain, shape: band, path: [[820, 2130], [870, 2300], [850, 2400]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  # Team B ridge, further east and with different gap heights
  - { id: ridge_b1, seed: 5, type: mountain, shape: band, path: [[2120, 0], [2160, 220], [2190, 400]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  - { id: ridge_b2, seed: 6, type: mountain, shape: band, path: [[2170, 720], [2130, 960], [2110, 1070]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  - { id: ridge_b3, seed: 7, type: mountain, shape: band, path: [[2130, 1280], [2160, 1500], [2190, 1730]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  - { id: ridge_b4, seed: 8, type: mountain, shape: band, path: [[2200, 2040], [2150, 2250], [2190, 2400]], width: 150, height: 200, warp: 40, warp_scale: 200 }
  # Great Oak Hill: wooded hill with a clearing at the zone
  - { id: oak_hill, seed: 9, type: hills, shape: blob, at: g, r: 330, rough: 0.4, squash: 0.7, angle: 15, warp: 90, warp_scale: 200, height: 70, fragment: 0.25, fragment_scale: 140 }
  - { id: oak_top, seed: 10, type: clearing, shape: blob, at: g, r: 90, rough: 0.5, squash: 0.8, warp: 30, warp_scale: 80 }
  # Fa: alley quarter, dense town and ruins
