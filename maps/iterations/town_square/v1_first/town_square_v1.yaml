  - { id: square, seed: 13, type: town, shape: blob, at: o, r: 300, rough: 0.35, squash: 0.85, angle: 10, warp: 80, warp_scale: 160, label: Town Square }
  # the attic: a hill of ruins above the square
  - { id: attic_hill, seed: 14, type: hills, shape: blob, at: fb, r: 290, rough: 0.4, squash: 0.65, angle: -20, warp: 70, warp_scale: 160, height: 80 }
  - { id: attic_ruins, seed: 15, type: ruins, shape: blob, at: fb, r: 150, rough: 0.55, squash: 0.7, angle: 10, warp: 50, warp_scale: 80, label: Attic }
  - { id: oak_wood1, seed: 20, type: forest, shape: blob, at: [1240, 520], r: 150, rough: 0.6, squash: 0.7, angle: 30, warp: 60, warp_scale: 100, fragment: 0.3, fragment_scale: 80 }
  - { id: oak_wood2, seed: 21, type: forest, shape: blob, at: [1580, 330], r: 130, rough: 0.6, squash: 0.7, angle: -20, warp: 60, warp_scale: 100, fragment: 0.3, fragment_scale: 80 }
  # Forest Glen
  - { id: glen_wood, seed: 16, type: forest, shape: blob, at: [1540, 2140], r: 360, rough: 0.5, squash: 0.65, angle: -10, warp: 100, warp_scale: 200, fragment: 0.2, fragment_scale: 120, label: Forest Glen }
  - { id: glen_clearing, seed: 17, type: clearing, shape: blob, at: f, r: 100, rough: 0.5, squash: 0.8, warp: 30, warp_scale: 80 }
  # bases
  - { id: town_a, seed: 18, type: town, shape: blob, at: [470, 1210], r: 140, rough: 0.5, squash: 0.7, warp: 40, warp_scale: 80 }
  - { id: clear_b, seed: 19, type: clearing, shape: blob, at: [2640, 1160], r: 220, rough: 0.6, squash: 0.7, warp: 60, warp_scale: 100 }

