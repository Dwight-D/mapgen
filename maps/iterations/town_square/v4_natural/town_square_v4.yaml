# town_square v4: natural-layout iteration of v3, 800x800. Changes vs v3: (1) spawn-to-zone links follow terrain and
# differ in character: the A links are winding lanes (narrow roads) through woods and under the western hills, the B links are
# wide roads along the river (north road round the spring, south link a trail with a ford over a side stream);
# wobble 30-45 and 4-6 waypoints each, ring asymmetric in length. (2) Dense interlocking town/ruins blocks around
# the square, Attic and Alleys with narrow streets between, some blocks impassable walls, ringed by gardens/fields.
# (3) NW, N-interior and Alleys-to-river shortcuts closed with impassable woods stands bounded by `within`, open
# ground kept elsewhere. (4) The river springs at the glen forest edge, meanders south and leaves at the south
# edge; a side stream from the NE hills joins it. (5) Rough blob shapes with strong warp for forests and fields.
# Checked with `flowgraph check --strict` (road-path level only). Prior generations: v1_first, v2_walled, v3_natural.
format_version: 1
name: town_square_v4
brief: |
  PITCH: A small river town, 800 x 800 m. Two teams fight over the market square in the middle of the town.
  A dense street fabric of houses surrounds the square; woods, hills and the river shape the approaches.
  FLOW (flowgraphs/town_square.flow.yaml): A (west) reaches the square O through the west gate (AO), B (east)
  through the east gate (BO) after bridging the river. South of the square the Alleys (Fa) are the entrance
  from the south; north of it the Attic (Fb) is a block of multi-storey buildings overlooking the square.
  Great Oak Hill (G, south) is a wooded hill just outside town overlooking the south entrance; Forest Glen
  (F, north) is a glade in the northern woods. Both zones have a link from each spawn.
  CHARACTER: A is a hamlet on dry ground under the western hills; its links are winding lanes through woods.
  B holds the pasture east of the river; its gate road crosses on a bridge, its north road is wide and fast,
  its link to the Great Oak Hill is a riverside road with a bridge and a ford.
  TEST: do the bridges give B a bottleneck or an edge? Is the Attic worth fighting for? Does G or F decide it?
