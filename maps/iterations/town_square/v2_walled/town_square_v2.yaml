# town_square v2: 800x800 river town with impassable forest walls; passes 'flowgraph check --strict --terrain'.
# Source: commit d48064b (maps/concepts/town_square.yaml).
format_version: 1
name: town_square_v2
brief: |
  PITCH: A small river town, 800 x 800 m. Two teams fight over the market square in the middle of the
  town. Everything that is not a street, a gate or a bridge is a wall: dense impassable forest, rock,
  town blocks and a river with three bridges. The terrain, not only the roads, forces the topology of
  flowgraphs/town_square.flow.yaml (checked with `flowgraph check --strict --terrain`).
  FLOW: A (west) and B (east) each reach the square O through a gate street (AO, BO). South of the square an
  alley (Fa, one narrow street between town blocks) is the entrance from the south; north of it the Attic (Fb)
  is a street under multi-storey buildings: from their upper floors a team can drop onto the square or cover
  it. Alleys and Attic are both city centre, one short street from O. Two control zones sit on the outskirts:
  Great Oak Hill (G) is a wooded hill south of the town that overlooks the south entrance (G - Fa); Forest
  Glen (F) is a forest glade north of the town (F - Fb). Both zones have a road from each spawn.
  CHARACTER: A is a ruined hamlet on the dry west side, its three roads need no crossing. B sits in pasture
  east of the river; all three of B's roads (gate, south road to G, north road to F) cross the river on a
  bridge, which makes B's routes predictable and defensible but a funnel for B's own traffic.
  TEST: do the gates become a meat grinder or get bypassed through the zones? Is the Attic's overwatch worth
  a fight or a sniper nest? Do bridges give B an advantage or a bottleneck?
  NOTE: the walkable terrain is exactly the nodes' plazas and the street corridors between them; every wall
  is `impassable` forest, hills, town or mountain, plus the river. Plazas are kept inside the node discs
  of the terrain check so that streets only meet at nodes.
size: [800, 800]
seed: 7311

terrain:
  height_max: 300
  base_height: 40
  relief: 10
  relief_scale: 400
  detail: 3
  detail_scale: 90

