# town_square v3: natural-layout draft, 800x800. Roads and trails are wobbled splines with 3-5 waypoints; obstruction
# is impassable scatter stands (forest clumps) and a few rock outcrops, not carved corridors; one river snakes
# between Team B and the town and bridges carry B's gate road and south road; the river never touches the town
# square. Meant as a rough draft for hand tweaking. Checked with `flowgraph check --strict` (road-path level only;
# terrain strictness is not a goal). Prior generations: v1_first (3000x2400), v2_walled (carved corridors).
format_version: 1
name: town_square_v3
brief: |
  PITCH: A small river town, 800 x 800 m. Two teams fight over the market square in the middle of the town.
  Dense woods and rock outcrops close off the open ground; the roads are the obvious ways.
  FLOW (flowgraphs/town_square.flow.yaml): A (west) reaches the square O through the west gate (AO), B (east)
  through the east gate (BO) after crossing the river on a bridge. South of the square the Alleys (Fa) are the
  entrance from the south; north of it the Attic (Fb) is a street of multi-storey buildings whose upper floors
  can drop onto or overlook the square. Alleys, Attic and square are one city centre. Great Oak Hill (G, south)
  is a wooded hill just outside town that overlooks the south entrance; Forest Glen (F, north) is a glade in
  the woods on the northern outskirts. Both zones have a road from each spawn.
  CHARACTER: A is a hamlet on dry ground in the west; its three roads need no crossing. B holds the pasture east
  of the river: its gate road and its south road cross the river on bridges (predictable, defensible, a funnel),
  its north road runs round the river's source and needs none.
  TEST: do the bridges give B a bottleneck or an edge? Is the Attic worth fighting for? Does G or F decide it?
size: [800, 800]
seed: 5527

terrain:
  height_max: 300
  base_height: 40
  relief: 12
  relief_scale: 400
  detail: 3
  detail_scale: 90

teams:
  A: { base: [110, 420], color: "#2f6fdf", name: "Team A spawn" }
  B: { base: [705, 370], color: "#f2a81d", name: "Team B spawn" }

points:
  ao: [255, 410]
  bo: [520, 385]

pois:
  - { id: o,  type: capture,  at: [400, 400], label: "Town square" }
  - { id: fa, type: landmark, at: [395, 265], label: Alleys }
  - { id: fb, type: landmark, at: [405, 545], label: Attic }
  - { id: g,  type: capture,  at: [380, 100], label: "Great Oak Hill" }
  - { id: f,  type: capture,  at: [455, 715], label: "Forest Glen" }

scatter:
  # impassable woods on open ground, in clumps
  - { id: wild_wood, seed: 1, type: forest, coverage: 0.5, scale: 75, clump: 0.55, avoid: 22, impassable: true }
  - { id: nw_wood, seed: 5, type: forest, coverage: 0.4, scale: 65, clump: 0.5, avoid: 22, impassable: true, within: [[0, 480], [260, 480], [300, 800], [0, 800]] }
  - { id: sw_wood, seed: 6, type: forest, coverage: 0.35, scale: 65, clump: 0.5, avoid: 22, impassable: true, within: [[0, 120], [230, 120], [230, 330], [0, 330]] }
  # woods on Great Oak Hill and in the glen
  - { id: oak_wood, seed: 2, type: forest, coverage: 0.6, scale: 60, clump: 0.4, avoid: 22, impassable: true, on: [hills], within: [[200, 0], [520, 0], [520, 230], [200, 230]] }
  - { id: glen_wood, seed: 3, type: forest, coverage: 0.5, scale: 60, clump: 0.4, avoid: 22, impassable: true, on: [forest], within: [[300, 580], [600, 580], [600, 800], [300, 800]] }
  # open texture
  - { id: meadow, seed: 4, type: field, coverage: 0.12, scale: 140, clump: 0.3, avoid: 15 }

