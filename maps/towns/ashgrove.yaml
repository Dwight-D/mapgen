format_version: 1
name: ashgrove
brief: |
  PITCH: Ashgrove, an organic hill town of irregular Voronoi districts with no planned grid, set in
  woodland with a marsh pocket (showcase map for the organic voronoi generator).
  FLOW: crooked arteries join four gates to the central plaza; the winding streets slow vehicles and favour
  infantry. Forest hugs the walls on two sides.
  TEST: do the irregular districts create usable alternative routes between the gates?
