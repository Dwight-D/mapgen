name: driftholt
brief: |
  PITCH: Driftholt, a sprawl with no wall: a Voronoi, radial and wedge core fading along its roads into hamlets and scattered farm clusters (organic, edge=fade, layers=organic-cells).
  FLOW: the town has no distinct boundary; entries lie at the far tips of the fringe roads, and the open scrub between the arms is the battlefield.
  TEST: does a tapering edge give a gradual transition from lane fighting to open ground, or does the fringe feel empty?
