name: wyndale
brief: |
  PITCH: Wyndale, an unwalled town of Voronoi cells re-cut into grids, bsp lots and fans, spilling over a valley floor (organic, edge=open, layers=organic-voronoi).
  FLOW: open entries on every artery; no wall, so the surrounding fields and copses give flanking approaches into the cell maze.
  TEST: does an open perimeter of irregular cells let attackers filter in from any side, or do arteries still dominate?
