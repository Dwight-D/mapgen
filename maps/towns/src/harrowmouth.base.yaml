format_version: 1
name: harrowmouth
brief: |
  PITCH: Harrowmouth, a walled harbour town on a bay, its land districts a mix of radial, Voronoi, grid, wedge and bsp layers (organic, layers=organic-mixed, water=bay).
  FLOW: the bay closes one flank; the wall is open on the shore, so sea-side assaults land in the harbour district.
  TEST: does the harbour flank pull the fight to the shore, and do the mixed districts keep the inland lanes varied?
