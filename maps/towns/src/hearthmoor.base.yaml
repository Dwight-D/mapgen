format_version: 1
name: hearthmoor
brief: |
  PITCH: Hearthmoor, a walled market town on open moorland plains (showcase map for the grid town generator).
  FLOW: Team A (Dunmark) holds the west road, team B (Eastwold) the east road; the town's gates and the
  market square in the middle are the fight. Open fields around the walls favour a siege approach, the
  copses to the north and south hide flanking columns.
  TEST: does play funnel into the gates, or do teams skirt the wall through the fields?
