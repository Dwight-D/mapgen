format_version: 1
name: marchfold
brief: |
  PITCH: Marchfold, a border fortress town on a march of low hills and fields (showcase map for the fort
  add-on: a star fortress inside the walls and two detached outposts).
  FLOW: the fortress is a hard point inside the town; outposts guard the approaches outside the gates. Teams
  start on opposite sides and must take the outposts or bypass them along the roads.
  TEST: is the fortress gate a mandatory pass, or can the town be crossed without touching it?
