format_version: 1
name: pentring
brief: |
  PITCH: Pentring, a five-spoked ring city in a bowl of low hills (showcase map for the radial town generator).
  FLOW: Five gates, one per spoke; two teams enter on opposite sides and meet at the plaza hub or work the
  ring roads. Wooded ridges outside screen approaches between gates.
  TEST: do the ring roads let a team swing between gates, or does everything collapse onto the plaza?
