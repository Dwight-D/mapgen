format_version: 1
name: cindermarket
brief: |
  PITCH: Cindermarket, a deliberately dense walled town: seven arteries, three cross arcs and small mixed-layer blocks packed to the wall (organic, edge=wall, layers=organic-mixed, arteries=7).
  FLOW: many short lanes and tight blocks inside one wall; the open ground outside is narrow, so the fight is street to street.
  TEST: does density create a real maze with several competing routes to the plaza, or does it just look busy?
