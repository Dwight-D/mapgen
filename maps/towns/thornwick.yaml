brief: |
  PITCH: Thornwick, a wall-less organic town that sprawls over a thorn-hedged moor (showcase map for the organic
  generator with edge=open and a warped outline).
  FLOW: curved arteries run from the plaza to open entries on the town's edge; with no wall the fight spills from
  the lanes into the surrounding scrub and woodland.
  TEST: does an open edge give flanking routes around the town, or do the entries still funnel play?
