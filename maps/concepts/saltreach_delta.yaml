name: saltreach_delta
brief: |
  PITCH: The Saltmere river leaves the hills, braids into four channels and bleeds into the southern sea
  through reedbeds and tidal marsh. The Bluff (A) holds the northern escarpment with the walled town of
  Saltreach and a stone road network; the Fenfolk (B) come out of the eastern lowlands with no bridges of
  their own, only fords, reed causeways and many ways in.
  FLOW: The bluff's rim is a cliff; only A's three roads (high road, causeway, coast road) and the narrow
  Goat Stair climb it. The high road crosses the Old Bridge - the one fast, obvious route both sides
  contest. Everything else is the delta: B fans out across seven fords onto the islands (Saltkeep, Heron
  Mound, the drowned shrine, the reed camp), while A comes down the causeway bridge straight onto the
  Saltkeep isle. A's hinterland (Low Granary, coast road) is only raidable through the reed-path fords;
  B's flank option is the north ford and the Goat Stair into the back of Saltreach.
  A has height, a cliff wall and roads; B has width and choice.
  TEST: does A's road advantage outweigh B's many delta approaches, or do A players turtle on the bluff and
  lose the delta? Is the marsh slow enough that supply carts stick to the fords (fords become ambush
  points) yet fast enough that infantry still use it? Does Saltkeep become the decisive keep? Is the
  Goat Stair a fun raid route or an unfair backdoor? The south coast (landing, shrine, ~8 min out) is
  deliberately remote adventuring ground - check it still sees play.

