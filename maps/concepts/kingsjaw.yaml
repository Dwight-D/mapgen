name: kingsjaw
brief: |
  PITCH: The Kingsjaw, a broken granite ridge, splits the march from south-south-west to north-north-east;
  only three gaps go through it, and each plays differently. West of the jaw lie the open wheat vales of
  the Crown (A); east of it the Hollowmark (B) holds forested hills around the Jawmere lake.
  FLOW: The Gate (south) is a wide saddle carrying the King's Road and the Gate keep site - the siege and
  supply-cart route. The Needle (centre) is a narrow slot for infantry raids and sappers. The Eyrie
  (north) is a high, rough saddle with a griffin roost - slow, exposed, made for fliers and small parties.
  A's open farmland favours cavalry and gives long sightlines onto the ridge foot; B's forest favours
  ambush and hides staging but slows everything that is not on a track.
  HOME OBJECTIVES (deliberately imbalanced): Old Mill sits in A's vale below the Needle, Wolf Den in B's
  forest below it on the other side. Each is a cheap win for its owner and a raid target for the enemy
  coming through the Needle - one each, so the pair cancels out.
  TEST: does play spread over all three passes or collapse onto the Gate? Is the Needle too strong a
  sapper route into A's vale? Does B's forest cover offset A's cavalry country, or does B get pinned on its
  side of the jaw? Does the Eyrie roost pull fliers away from the main fight?
