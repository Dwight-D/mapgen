name: ashen_steppe
brief: |
  PITCH: A burnt-over grass sea where the Ashwater river swings in a great bend around Cinder Hill and
  its ring-fort. Sightlines run for kilometres; this is cavalry country, and the only cover is copses,
  kurgan mounds, the ruined town of Old Ashford and the hill itself.
  FLOW: The Horse-clans (A) ride in from the open south-west with a web of tracks and two fords over the
  river's southern leg. The Ashen Legion (B) hold Ferrybridge, a river town on the north-east bank, with
  the imperial road, a stone bridge and the escarpment behind them - fewer routes, but paved and fast.
  Inside the bend lie the hill-fort keep site and the burnt town; outside it, kurgans, a horse fair and
  bandit camps on the steppe.
  TEST: does the hill-fort dominate (long sightlines from the crest) or is it a trap that cavalry
  bypasses? Do A's many tracks beat B's one fast road? Are the copses and kurgans enough cover for
  infantry to cross open ground at all, or does infantry need the ruined town to matter?
