name: thornwald
brief: |
  PITCH: An old-growth forest swallowed a kingdom; the King's Road still winds diagonally through it past
  overgrown ruins where things now nest. Sightlines are a spear's length, so this is an infantry,
  ambush and sapper map - cavalry live on the road and in the two meadows, and those meadows decide
  where keeps can see anything at all.
  FLOW: The Wardens (A) hold Southwatch at the road's south-west end and own the road. The Charcoalers
  (B) come down from the Ravenscar hills in the north, cut off from the road by the Mossbeck stream and
  forced through four fords. Kingsmead (central meadow, Thornhold keep site) and Stag Lea (east meadow)
  are the only open ground. Ruins in forest clearings hold neutral camps and the barrow treasure.
  TEST: do the meadows become the focus or do players avoid them as killing fields? Is the road a
  liability for A (predictable, ambushable) as much as an asset? Does fog-of-forest make raids on supply
  feel fair? Do fliers matter when they can't see under the canopy?
