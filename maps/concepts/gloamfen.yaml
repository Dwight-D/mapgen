name: gloamfen
brief: |
  PITCH: The Gloamfen is a drowned country of meres, reedbeds and peat islands; the only firm ground worth
  holding is Gloamholm, an island town ringed by four meres and four channels. Every supply cart crosses
  open marsh on a causeway in full view, so logistics - and raiding them - is the whole game.
  FLOW: The Dykewardens (A) come from drained fields on the west edge along one long stone causeway over
  the West bridge - fast, but a single 1.5 km line through open reeds - plus two long peat paths that skirt
  the meres north (Eel-men, Heron Staithe) and south (Drowned Abbey, south ford). The Bog-kin (B) sit on
  Gloam Heath east of the ring: the North Causeway loops round Gloam Mere to the north bridge, and a peat
  path fords the east channel straight onto the island. Gloamholm keep is the prize; the island holds
  the Peat Cuttings and the Bog Hag, the far shores the abbey relic and the camps.
  TEST: can A protect a 1.5 km causeway, or does it bleed haulers to raids from the reeds? Do B's fords
  give enough alternative routes to matter, or do both sides funnel onto the two bridges? Is marsh
  (cost 2.5) slow enough that roads dominate but not so slow that cavalry ignore everything else?
