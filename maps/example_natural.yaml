name: natural
brief: |
  Asymmetric two-team map exercising the natural-shape keys. The Valley team starts in the south-west on the
  river's west bank with a town and a short road to the single bridge. The Highland team starts in the
  north-east on open farmland under a hill; its road to the bridge is longer but faster (fields), and a
  mountain band with one pass screens its north flank. Ragged forests (fragment, warp) fill the river valley,
  noise scatter dots forests and fields across the rest of the map, and the river varies in width.
  Test: the bridge and the pass should be the chokepoints; the ford keep controls the bridge approach.
size: [3000, 3000]
seed: 2026

terrain:
  base_height: 45
  relief: 35
  detail: 9
  detail_scale: 220

teams:
  A: { base: [380, 1000], name: Valley }
  B: { base: [2620, 2050], name: Highland }

